<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Token</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #050816; color: #eef2ff; }
    .page { max-width: 1080px; margin: 0 auto; padding: 24px; }
    header, footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: clamp(2rem, 4vw, 2.5rem); }
    nav a { display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 999px; color: #eef2ff; text-decoration: none; background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.08); transition: transform 160ms ease, background 160ms ease; }
    nav a:hover, nav a.active { background: linear-gradient(135deg, rgba(236,72,153,0.95), rgba(59,130,246,0.95)); transform: translateY(-1px); }
    .panel { background: rgba(15,23,42,0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 26px; box-shadow: 0 30px 90px rgba(0,0,0,0.28); }
    .grid { display: grid; gap: 18px; }
    .field { display: grid; gap: 10px; }
    .field label { font-weight: 700; color: rgba(226,232,240,0.85); }
    .field input { width: 100%; border-radius: 16px; border: 1px solid rgba(148,163,184,0.18); background: rgba(15,23,42,0.9); color: #eef2ff; padding: 14px 16px; }
    textarea { width: 100%; min-height: 110px; border-radius: 16px; border: 1px solid rgba(148,163,184,0.18); background: rgba(15,23,42,0.9); color: #eef2ff; padding: 14px 16px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; }
    button { border: none; border-radius: 16px; padding: 14px 22px; cursor: pointer; background: linear-gradient(135deg, rgba(236,72,153,0.95), rgba(59,130,246,0.95)); color: #fff; font-weight: 800; }
    .secondary { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: #eef2ff; }
    .notice { color: rgba(226,232,240,0.75); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; word-break: break-all; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
  </style>

  <style>
    /* Antigravity injected modern sexy gradient button styles */
    button, .button, .btn, .nav a {
      background: linear-gradient(135deg, #ff007a 0%, #7928ca 100%) !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 12px 24px !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      cursor: pointer !important;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
      box-shadow: 0 4px 15px rgba(121, 40, 202, 0.3), inset 0 1px 1px rgba(255,255,255,0.2) !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2) !important;
      text-decoration: none !important;
    }
    button:hover, .button:hover, .btn:hover, .nav a:hover {
      background: linear-gradient(135deg, #ff1a8b 0%, #8b3cda 100%) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 25px rgba(121, 40, 202, 0.5), inset 0 1px 1px rgba(255,255,255,0.3) !important;
    }
    button:active, .button:active, .btn:active, .nav a:active {
      transform: translateY(1px) !important;
      box-shadow: 0 2px 10px rgba(121, 40, 202, 0.4) !important;
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div>
        <h1>Generate Token</h1>
        <p class="notice">Generate a token from a username and open its user dashboard URL.</p>
      </div>
      <nav>
        <a href="/dashboard">Overview</a>
        <a href="/dashboard/make">Make</a>
        <a href="/dashboard/token-generate" class="active">Generate</a>
        <a href="/dashboard/DeverloperSetting">Developer Setting</a>
      </nav>
    </header>

    <section class="panel">
      <div class="grid">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Enter a username" autocomplete="username" />
        </div>

        <div class="actions">
          <button id="generateBtn" type="button">Generate token</button>
          <button id="copyUrlBtn" type="button" class="secondary" style="display:none;">Copy dashboard URL</button>
          <button id="openRequestsBtn" type="button" class="secondary" style="display:none;">Open requests</button>
        </div>

        <div>
          <div class="notice" id="status">Ready.</div>
          <div style="height:10px;"></div>
          <div class="field">
            <label>Generated token</label>
            <textarea id="tokenOutput" class="mono" readonly placeholder="Token will appear here..."></textarea>
          </div>
          <div class="field">
            <label>Dashboard URL</label>
            <textarea id="urlOutput" class="mono" readonly placeholder="Dashboard URL will appear here..."></textarea>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <span class="notice">Uses <span class="mono">/api/token/generate</span> under the hood.</span>
    </footer>
  </div>

  <script src="/js/token-generate.js"></script>
</body>
</html>
