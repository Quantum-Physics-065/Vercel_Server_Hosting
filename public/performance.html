<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Performance</title>
  <style>
    :root {
      color-scheme: dark;
      color: #f8fafc;
      background: #050916;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #050816 0%, #090c19 100%); }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px; }
    .hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .hero h1 { margin: 0; font-size: clamp(2rem, 4vw, 2.6rem); }
    .hero p { margin: 0; color: rgba(226,232,240,0.78); max-width: 680px; line-height: 1.7; }

    .nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 20px;
      min-height: 44px;
      color: #eef2ff;
      text-decoration: none;
      background: rgba(15,23,42,0.72);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 170ms ease, transform 170ms ease;
      font-weight: 600;
    }
    .nav a.active, .nav a:hover { background: linear-gradient(135deg, rgba(236,72,153,0.95), rgba(79,70,229,0.96)); transform: translateY(-1px); }

    .grid { display: grid; gap: 22px; }
    .card { background: rgba(15,23,42,0.8); border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); padding: 24px; box-shadow: 0 40px 100px rgba(0,0,0,0.24); }
    .row { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; }
    .metric { flex: 1 1 240px; min-width: 240px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
    .metric .label { color: rgba(226,232,240,0.7); font-weight: 600; margin-bottom: 6px; }
    .metric .value { color: #fff; font-weight: 800; font-size: 1.15rem; word-break: break-word; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }

    .loading { color: rgba(226,232,240,0.6); }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>Server Performance</h1>
        <p>Runtime and storage metrics from <span class="mono">/api/status</span>.</p>
      </div>
    </div>

    <nav class="nav">
      <a href="/dashboard">Overview</a>
      <a href="/dashboard/files">Files</a>
      <a href="/dashboard/connection">Connection</a>
      <a href="/dashboard/certificates">Certificates</a>
      <a href="/dashboard/performance" class="active">Server Performance</a>
    </nav>

    <div class="grid">
      <section class="card">
        <div class="row">
          <div class="metric"><div class="label">Uptime</div><div class="value" id="uptime">—</div></div>
          <div class="metric"><div class="label">Started at</div><div class="value mono" id="startedAt">—</div></div>
          <div class="metric"><div class="label">Storage files</div><div class="value" id="fileCount">—</div></div>
          <div class="metric"><div class="label">Total storage size</div><div class="value" id="totalSize">—</div></div>
        </div>
        <div class="row">
          <div class="metric"><div class="label">Protocol</div><div class="value" id="protocol">—</div></div>
          <div class="metric"><div class="label">Host</div><div class="value mono" id="host">—</div></div>
          <div class="metric"><div class="label">Port</div><div class="value" id="port">—</div></div>
          <div class="metric"><div class="label">SSL enabled</div><div class="value" id="sslEnabled">—</div></div>
        </div>

        <div class="row">
          <div class="metric"><div class="label">SSL cert path</div><div class="value mono" id="sslCertPath">—</div></div>
          <div class="metric"><div class="label">SSL key path</div><div class="value mono" id="sslKeyPath">—</div></div>
          <div class="metric"><div class="label">SSL CA path</div><div class="value mono" id="sslCaPath">—</div></div>
          <div class="metric"><div class="label">Allowed origins</div><div class="value mono" id="allowedOrigins">—</div></div>
        </div>
      </section>
    </div>
  </div>

  <script src="/js/performance.js"></script>
</body>
</html>
