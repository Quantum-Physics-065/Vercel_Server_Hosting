<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background: #050816; color: #eef2ff; display: grid; place-items: center; }
    .card { width: min(780px, calc(100% - 32px)); padding: 32px; border-radius: 28px; background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 28px 90px rgba(0,0,0,0.3); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 3vw, 2.4rem); }
    p { margin: 0; color: rgba(226,232,240,0.72); line-height: 1.6; }
    .grid { display: grid; gap: 20px; margin-top: 24px; }
    .panel { padding: 20px; border-radius: 22px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .row span { color: rgba(226,232,240,0.75); }
    .row strong { color: #fff; }
    .button { margin-top: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6366f1, #ec4899); color: #fff; cursor: pointer; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>User Dashboard</h1>
    <p id="statusText">Fetching user details from token...</p>
    <div class="grid" id="detailsGrid"></div>
    <button class="button" id="copyTokenButton" style="display:none;">Copy dashboard URL</button>
  </main>

  <script>
    const detailsGrid = document.getElementById('detailsGrid');
    const statusText = document.getElementById('statusText');
    const copyButton = document.getElementById('copyTokenButton');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function addDetail(label, value) {
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML = `<div class="row"><span>${label}</span><strong>${value}</strong></div>`;
      detailsGrid.append(panel);
    }

    async function loadUser() {
      if (!token) {
        statusText.textContent = 'Token is missing from the URL.';
        statusText.classList.add('error');
        return;
      }
      try {
        const resp = await fetch(`/api/user-details?token=${encodeURIComponent(token)}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Unable to load details');

        statusText.textContent = `Welcome ${data.username}. Token issued ${data.createdAt}.`;
        addDetail('Username', data.username);
        addDetail('Token', data.token);
        addDetail('Client IP', data.ip);
        addDetail('User Agent', data.userAgent || 'Unknown');
        addDetail('Protocol', data.server.protocol);
        addDetail('Host', data.server.host);
        addDetail('Port', data.server.port);
        addDetail('HTTPS enabled', data.server.sslEnabled ? 'Yes' : 'No');
        addDetail('Total files', data.storage.fileCount);
        addDetail('Total size', `${(data.storage.totalSize / 1024).toFixed(1)} KB`);

        copyButton.style.display = 'inline-flex';
        copyButton.addEventListener('click', async () => {
          await navigator.clipboard.writeText(window.location.href);
          statusText.textContent = 'Dashboard URL copied to clipboard.';
        });
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
        statusText.classList.add('error');
      }
    }

    window.addEventListener('DOMContentLoaded', loadUser);
  </script>
</body>
</html>
