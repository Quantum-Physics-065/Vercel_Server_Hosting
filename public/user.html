<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background: #050816; color: #eef2ff; display: grid; place-items: center; }
    .card { width: min(780px, calc(100% - 32px)); padding: 32px; border-radius: 28px; background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 28px 90px rgba(0,0,0,0.3); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 3vw, 2.4rem); }
    p { margin: 0; color: rgba(226,232,240,0.72); line-height: 1.6; }
    .grid { display: grid; gap: 20px; margin-top: 24px; }
    .panel { padding: 20px; border-radius: 22px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .row span { color: rgba(226,232,240,0.75); }
    .row strong { color: #fff; }
    .button { margin-top: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6366f1, #ec4899); color: #fff; cursor: pointer; }
    .error { color: #fca5a5; }
  </style>

  <style>
    /* Antigravity injected modern sexy gradient button styles */
    button, .button, .btn, .nav a {
      background: linear-gradient(135deg, #ff007a 0%, #7928ca 100%) !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 12px 24px !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      cursor: pointer !important;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
      box-shadow: 0 4px 15px rgba(121, 40, 202, 0.3), inset 0 1px 1px rgba(255,255,255,0.2) !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2) !important;
      text-decoration: none !important;
    }
    button:hover, .button:hover, .btn:hover, .nav a:hover {
      background: linear-gradient(135deg, #ff1a8b 0%, #8b3cda 100%) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 25px rgba(121, 40, 202, 0.5), inset 0 1px 1px rgba(255,255,255,0.3) !important;
    }
    button:active, .button:active, .btn:active, .nav a:active {
      transform: translateY(1px) !important;
      box-shadow: 0 2px 10px rgba(121, 40, 202, 0.4) !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; margin-bottom:20px;">
      <div>
        <h1>User Dashboard</h1>
        <p id="statusText">Fetching user details from token...</p>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <a href="/dashboard" class="link" style="background:rgba(255,255,255,0.08); padding:12px 18px; border-radius:16px;">Overview</a>
        <a href="/dashboard/login" class="link" style="background:rgba(255,255,255,0.08); padding:12px 18px; border-radius:16px;">Login</a>
        <a href="/dashboard/make" class="link" style="background:rgba(255,255,255,0.08); padding:12px 18px; border-radius:16px;">Make</a>
      </div>
    </div>
    <div class="grid" id="detailsGrid"></div>
    <button class="button" id="copyTokenButton" style="display:none;">Copy dashboard URL</button>
    <a id="requestsLink" href="#" class="button" style="display:none; margin-top:16px;">View token requests</a>
  </main>

  <script src="/js/user.js"></script>
</body>
</html>
