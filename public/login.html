<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080c19; color: #eef2ff; font-family: Inter, system-ui, sans-serif; }
    .card { width: min(520px, calc(100% - 32px)); padding: 32px; border-radius: 28px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 90px rgba(0,0,0,0.25); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 3vw, 2.5rem); }
    p { margin: 0 0 24px; color: rgba(226,232,240,0.7); }
    .field { display: grid; gap: 10px; margin-bottom: 18px; }
    .field label { font-weight: 600; color: #dbeafe; }
    .field input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(148,163,184,0.2); background: rgba(15,23,42,0.9); color: #eef2ff; }
    button { width: 100%; padding: 14px 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6366f1, #ec4899); color: #fff; font-weight: 700; cursor: pointer; }
    .info { margin-top: 16px; color: rgba(226,232,240,0.75); font-size: 0.97rem; }
    .link { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Server Login</h1>
    <p>Generate a one-time token and open a secure user dashboard URL.</p>
    <div class="field">
      <label for="usernameInput">Username</label>
      <input id="usernameInput" type="text" placeholder="Enter a username" autocomplete="username" />
    </div>
    <button id="loginButton" type="button">Generate login link</button>
    <p class="info" id="statusText">Enter your username and click the button.</p>
    <div id="result" style="display:none; margin-top:18px; padding:18px; border-radius:16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
      <p style="margin:0 0 8px; color:#d1d5db;">Your login URL:</p>
      <p><a id="resultUrl" class="link" target="_blank" rel="noopener"></a></p>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="copyButton" style="width:auto;">Copy link</button>
        <a id="resultRequestsUrl" class="link" target="_blank" rel="noopener" style="display:none; align-items:center; background:rgba(255,255,255,0.08); padding:10px 14px; border-radius:16px;">Open requests page</a>
      </div>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
